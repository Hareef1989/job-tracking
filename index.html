<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามงานทีมช่าง</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1a2233;--mut:#6b7590;--bd:#e2e7f1;--pri:#2563eb;--chip:#eaf0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1320;--card:#171e30;--tx:#e8ecf6;--mut:#8f9ab5;--bd:#27314b;--pri:#5b8cff;--chip:#1f2a47}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1320;--card:#171e30;--tx:#e8ecf6;--mut:#8f9ab5;--bd:#27314b;--pri:#5b8cff;--chip:#1f2a47}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:80%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
.c-create{--c:#64748b}.c-assign{--c:#3b82f6}.c-accept{--c:#14b8a6}.c-depart{--c:#8b5cf6}.c-onsite{--c:#f59e0b}.c-done{--c:#22c55e}.c-leave{--c:#84cc16}.c-help{--c:#ef4444}.p-None{--c:#3b82f6}.p-Minor{--c:#eab308}.p-Major{--c:#f97316}.p-Critical{--c:#dc2626}.pb{font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--c);color:#fff;font-weight:700;white-space:nowrap}.p-Minor.pb{color:#1a1a1a}.sla{font-size:.82rem;margin:4px 0}.sla.bad{color:#ef4444;font-weight:700}.sla.ok{color:#22c55e}.sla.warn{color:#f59e0b;font-weight:700}.c-sla{--c:#f59e0b}.job.near{box-shadow:0 0 0 2px #f59e0b66}.dbar{align-items:center}.bar input.dt{flex:0 1 150px;min-width:140px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 2px}.sub{color:var(--mut);font-size:.85rem;margin:0 0 10px}
h3{margin:0 0 8px;font-size:1rem}
textarea{min-height:130px;resize:vertical;line-height:1.5}
#f-paste{min-height:80px}.paste{background:var(--chip);border:1px dashed var(--pri);border-radius:12px;padding:10px;margin-bottom:6px}.pts a{color:var(--pri);margin-right:10px;font-size:.82rem}.meta{font-size:.84rem;color:var(--mut);margin:4px 0}.desc{max-height:9em;overflow:auto}
.banner{background:#f59e0b22;border:1px solid #f59e0b88;border-radius:10px;padding:8px 12px;font-size:.85rem;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.danger{color:#ef4444}button[hidden]{display:none}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;font-weight:600;padding:8px 4px;font-size:.85rem}.tabs .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border-radius:99px;padding:5px 14px;white-space:nowrap;font-size:.85rem}.chip.on{background:var(--c,var(--pri));color:#fff;border-color:var(--c,var(--pri))}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input{flex:1;min-width:180px}.bar select{width:auto;min-width:140px}.bar select.dt{min-width:96px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;border-top:4px solid var(--c,var(--pri))}.stat b{font-size:1.6rem;display:block;line-height:1.2}.stat span{color:var(--mut);font-size:.8rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.br{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:.85rem}
.trk{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;display:flex}.trk i{display:block;height:100%;background:var(--c,var(--pri))}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.88rem}.li:last-child{border:0}
.mut{color:var(--mut);font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.job{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;border-left:5px solid var(--c)}
.job.c-help{box-shadow:0 0 0 2px #ef444440}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.no{font-weight:700;font-size:1.05rem}
.badge{font-size:.75rem;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-weight:700;white-space:nowrap}
.desc{margin:6px 0;color:var(--mut);font-size:.9rem;word-break:break-word;white-space:pre-wrap}
.team{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.team span{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:.82rem}
.late{color:#ef4444;font-weight:600}
.tl{display:grid;grid-template-columns:repeat(7,1fr);margin:12px 0 8px;text-align:center}
.st{position:relative;font-size:.56rem;color:var(--mut);line-height:1.3}
.st:before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:3px;background:var(--bd)}
.st:first-child:before{display:none}.st.done:before{background:var(--c)}
.dot{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;background:var(--bd);margin:0 auto 4px;display:grid;place-items:center;color:#fff;font-size:.65rem}
.st.done .dot{background:var(--c)}.st.done{color:var(--tx)}.st b{display:block;font-size:.6rem;color:var(--c)}.st small{display:block}
.helpbox{background:#ef444415;border:1px solid #ef444455;color:#ef4444;border-radius:10px;padding:6px 10px;font-size:.84rem;margin:8px 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.act button{padding:6px 12px;font-size:.84rem}
.empty{text-align:center;color:var(--mut);padding:36px 0;grid-column:1/-1}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(600px,94vw);max-height:92vh;padding:18px}
dialog::backdrop{background:#0008}
label{display:block;font-size:.82rem;color:var(--mut);margin:10px 0 3px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jb{display:flex;align-items:center;gap:6px}.jb i{font-style:normal;font-weight:700}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.err{color:#ef4444;font-size:.85rem;min-height:1.2em;margin-top:8px}
@media(max-width:520px){.r2,.r3{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📡 ติดตามงานทีมช่าง</h1>
  <p class="sub" id="sub">กำลังเชื่อมต่อ Supabase… | by Hareef</p>
  <input id="me" placeholder="👤 ชื่อของคุณ (ใช้บันทึกในประวัติการแก้ไข)" style="max-width:300px;margin-bottom:10px">
  <div class="banner" id="banner" hidden></div>
  <div class="banner" id="alertbar" hidden style="cursor:pointer;background:#ef444420;border-color:#ef4444"></div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="pchips"></div>

  <section id="v-dash"></section>

  <section id="v-jobs" hidden>
    <div class="bar">
      <input id="q" type="search" placeholder="ค้นหา เลขงาน, ชื่อช่าง, รายละเอียด…">
      <select id="fpr"></select>
      <button class="pri" id="add">＋ เพิ่มงาน</button>
      <button id="exp" hidden>⬇ Export Excel</button>
    </div>
    <div class="bar dbar"><span class="mut">📅 กรองวันที่</span>
      <select id="fby" class="dt" style="min-width:150px"><option value="create">ตามวันที่สร้างงาน</option><option value="due">ตามเส้นตาย</option></select>
      <input type="date" id="fdf" class="dt" title="ตั้งแต่วันที่"><span class="mut">ถึง</span><input type="date" id="fdt" class="dt" title="ถึงวันที่">
      <button id="fp1">วันนี้</button><button id="fp7">7 วัน</button><button id="fpm">เดือนนี้</button><button id="fclr">ล้าง</button></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="list"></div>
  </section>

  <section id="v-hist" hidden>
    <div class="bar"><input id="hq" type="search" placeholder="ค้นหาประวัติ: เลขงาน, ชื่อ, ผู้แก้ไข…"></div>
    <div class="panel" id="hlist"></div>
  </section>

  <section id="v-team" hidden>
    <div class="bar"><button class="pri" id="addt">＋ เพิ่มช่าง</button><button class="pri" id="addtm">＋ สร้างทีม</button></div>
    <div class="stats" id="tstats"></div>
    <h3>กองงาน</h3><div class="grid" id="tmlist"></div>
    <h3 style="margin-top:14px">รายชื่อช่างทั้งหมด (จับคู่ทีม / สถานะ ลา-ทำงาน)</h3><div class="panel" id="tclist"></div>
  </section>

  </div>

<dialog id="dlg">
  <h3 id="dt">เพิ่มงาน</h3>
  <div class="paste"><label style="margin-top:0">⚡ วางข้อความงานจากระบบ (กรอกอัตโนมัติ)</label><textarea id="f-paste" rows="3" placeholder="วางข้อความที่นี่ เช่น JB26-1234567 : Service Outage : … Finish Before 24-10-2026 13:09:00 to ผู้รับงาน by ผู้ส่งงาน 08xxxxxxxx แล้วขึ้นบรรทัดใหม่ตามด้วยชื่อทีมช่าง คั่นด้วย ,"></textarea><div class="mut" id="f-parsed" style="margin-top:4px"></div><div class="pts" id="f-pts"></div></div>
  <label>เลขงาน</label>
  <div class="jb"><i>JB26-</i><input id="f-no" maxlength="7" inputmode="numeric" placeholder="1234567"></div>
  <label>ความสำคัญ (Priority)</label><select id="f-pri"></select><div class="mut" id="f-sla" style="margin-top:4px"></div>
  <label>เส้นตายปิดงาน (Finish Before)</label><input type="datetime-local" id="f-due">
  <label>หัวข้องาน</label><input id="f-title" placeholder="เช่น Service Outage">
  <div class="r2"><div><label>ผู้ส่งงาน</label><input id="f-snd"></div><div><label>เบอร์ผู้ส่งงาน</label><input id="f-tel" inputmode="tel"></div></div>
  <label>ผู้รับงาน</label><input id="f-rcv">
  <label>รายละเอียดงาน</label>
  <textarea id="f-desc" rows="5" placeholder="เช่น อาการ/ปัญหา, ตำแหน่งหรือจุดที่เกิดเหตุ, ชื่อลูกค้าและเบอร์ติดต่อ, ข้อมูลเพิ่มเติม"></textarea>
  <label>เลือกกองงาน (เติมชื่ออัตโนมัติ)</label><select id="f-teamsel"></select>
  <label>ทีมช่าง (3 คน)</label>
  <div class="r3"><input id="m0" placeholder="ช่างคนที่ 1"><input id="m1" placeholder="ช่างคนที่ 2"><input id="m2" placeholder="ช่างคนที่ 3"></div>
  <label>จังหวัด</label><select id="f-prov"></select>
  <label>วัน-เวลาแต่ละขั้นตอน (เว้นว่างได้)</label>
  <div class="r2" id="times"></div>
  <label style="display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" id="f-help" style="width:auto"> สถานะ Help (งานติดปัญหา)</label>
  <input id="f-note" placeholder="ระบุปัญหา เช่น ขาดอุปกรณ์ เข้าพื้นที่ไม่ได้" style="margin-top:6px">
  <div class="err" id="err"></div>
  <div class="foot"><button id="cancel">ยกเลิก</button><button class="pri" id="save">บันทึก</button></div>
</dialog>

<dialog id="dlg3">
  <h3 id="tt">เพิ่มช่าง</h3>
  <label>ชื่อช่าง</label><input id="t-name">
  <div class="r2"><div><label>เบอร์โทร</label><input id="t-tel" inputmode="tel"></div><div><label>จังหวัด</label><select id="t-prov"></select></div></div>
  <label>ทีม</label><select id="t-team"></select>
  <div class="err" id="err3"></div><div class="foot"><button id="cancel3">ยกเลิก</button><button class="pri" id="save3">บันทึก</button></div>
</dialog>

<dialog id="dlg4">
  <h3 id="tmt">สร้างทีม</h3>
  <div class="r2"><div><label>ชื่อทีม</label><input id="tm-name" placeholder="เช่น ทีม A"></div><div><label>จังหวัด</label><select id="tm-prov"></select></div></div>
  <label>สมาชิกทีม (ติ๊กเลือกช่างที่จะจับคู่)</label><div id="tm-mem" class="panel" style="max-height:240px;overflow:auto;padding:8px"></div>
  <div class="err" id="err4"></div><div class="foot"><button id="cancel4">ยกเลิก</button><button class="pri" id="save4">บันทึก</button></div>
</dialog>

<dialog id="dlg5">
  <h3 id="lvt">ลางาน</h3>
  <div class="r2"><div><label>ลาตั้งแต่วันที่</label><input type="date" id="lv-from"></div><div><label>ถึงวันที่</label><input type="date" id="lv-to"></div></div>
  <label>เหตุผล</label><input id="lv-note" placeholder="ลาป่วย / ลากิจ / พักร้อน">
  <div class="err" id="err5"></div>
  <div class="foot"><button id="cancel5">ปิด</button><button class="danger" id="lv-clear">ยกเลิกการลา</button><button class="pri" id="save5">บันทึก</button></div>
</dialog>

<dialog id="cfm"><p id="cfm-t" style="margin:0 0 6px"></p><div class="foot"><button id="cfm-no">ยกเลิก</button><button class="danger" id="cfm-yes">ลบ</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const STEPS=[["create","Create"],["assign","Assign"],["accept","Accept"],["depart","Depart"],["onsite","Onsite"],["done","Done"],["leave","Leave"]];
const PROV={"ปัตตานี":["เมืองปัตตานี","โคกโพธิ์","หนองจิก","ปะนาเระ","มายอ","ทุ่งยางแดง","สายบุรี","ไม้แก่น","ยะหริ่ง","ยะรัง","กะพ้อ","แม่ลาน"],
"ยะลา":["เมืองยะลา","เบตง","บันนังสตา","ธารโต","ยะหา","รามัน","กาบัง","กรงปินัง"],
"นราธิวาส":["เมืองนราธิวาส","ตากใบ","บาเจาะ","ยี่งอ","ระแงะ","รือเสาะ","ศรีสาคร","แว้ง","สุคิริน","สุไหงโก-ลก","สุไหงปาดี","จะแนะ","เจาะไอร้อง"],
"สงขลา":["เมืองสงขลา","สทิงพระ","จะนะ","นาทวี","เทพา","สะบ้าย้อย","ระโนด","กระแสสินธุ์","รัตภูมิ","สะเดา","หาดใหญ่","นาหม่อม","ควนเนียง","บางกล่ำ","สิงหนคร","คลองหอยโข่ง"]};
const KEY={jobs:"jb26-jobs",leaves:"jb26-leaves",techs:"jb26-techs",teams:"jb26-teams",history:"jb26-history"};
const PRI=["None","Minor","Major","Critical"],SLA={None:720,Minor:72,Major:10,Critical:3},SLAT={None:"30 วัน",Minor:"3 วัน",Major:"10 ชม.",Critical:"3 ชม."};
const pri=j=>PRI.includes(j.priority)?j.priority:"None";
const data={jobs:[],leaves:[],techs:[],teams:[],history:[]},cols={jobs:null,leaves:null,techs:null,teams:null,history:null};
const S={tab:"dash",prov:"all",dist:"all",flt:"all",pri:"all",df:"",dt:"",by:"create",q:""};
let canWrite=true,DL=null,editId=null,editLid=null,busy=false,curPts=[],autoCreate=false,warnKey="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const fD=i=>i?new Date(i).toLocaleDateString("th-TH",{day:"numeric",month:"short"}):"–";
const fT=i=>i?new Date(i).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}):"";
const fDT=i=>i?fD(i)+" "+fT(i):"–";
const fFull=i=>{if(!i)return"";const d=new Date(i);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
const toLocal=i=>{if(!i)return"";const d=new Date(i);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const now=()=>new Date().toISOString();
const lastIdx=j=>{let r=-1;STEPS.forEach(([k],n)=>{if(j.steps&&j.steps[k])r=n});return r};
const status=j=>j.help?"help":(lastIdx(j)<0?"create":STEPS[lastIdx(j)][0]);
const label=s=>s==="help"?"Help":STEPS.find(x=>x[0]===s)[1];
const fin=j=>["done","leave"].includes(status(j));
const dueAt=j=>j.deadline?new Date(j.deadline).getTime():(j.steps&&j.steps.create?new Date(j.steps.create).getTime()+SLA[pri(j)]*36e5:null);
const dur=ms=>{const m=Math.max(0,Math.round(ms/6e4)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d>0?d+" วัน "+h+" ชม.":h>0?h+" ชม. "+m%60+" นาที":m+" นาที"};
const slaInfo=j=>{const du=dueAt(j);if(du===null)return null;const dv=j.steps.done||j.steps.leave,done=dv?new Date(dv).getTime():null,diff=du-(done===null?Date.now():done);return{done:done!==null,over:diff<0,diff,near:done===null&&diff>=0&&diff<SLA[pri(j)]*36e5*0.25}};
const isLate=j=>{const s=slaInfo(j);return!!s&&!s.done&&s.over};
function slaLine(j){const s=slaInfo(j);if(!s)return"";const t=j.deadline?"กำหนด "+fDT(j.deadline):"SLA "+SLAT[pri(j)];
  if(s.done)return `<div class="sla ${s.over?"bad":"ok"}">${s.over?"❌ ปิดงานเกิน SLA "+dur(-s.diff):"✅ ปิดงานทัน SLA"} · ${t}</div>`;
  return `<div class="sla ${s.over?"bad":s.near?"warn":""}">${s.over?"⏱ เกิน SLA "+dur(-s.diff):(s.near?"⚠️ ใกล้ครบ SLA · เหลือ ":"⏳ เหลือ ")+dur(s.diff)} · ${t}</div>`}
const leaveState=l=>{const t=today();return l.to<t?"end":l.from>t?"soon":"now"};

/* ---------- storage ---------- */
function lsGet(k){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[]}catch(e){return[]}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fail(e){alert("บันทึกไม่สำเร็จ"+(e&&e.code==="invalid_argument"?" (สิทธิ์ของคุณอาจเป็นแบบอ่านอย่างเดียว)":" กรุณาลองอีกครั้ง"))}
function persist(n,o){if(!canWrite){fail({code:"invalid_argument"});return}
  if(cols[n]){const{id,...d}=o;cols[n].doc(String(id)).set(d).catch(fail)}else{lsSet(KEY[n],data[n]);render()}}
function remove(n,o){if(!canWrite){fail({code:"invalid_argument"});return}
  if(cols[n])cols[n].doc(String(o.id)).delete().catch(fail);else{data[n]=data[n].filter(x=>x!==o);lsSet(KEY[n],data[n]);render()}}

function parseTicket(T){
  T=String(T).replace(/\u00a0/g," ");const r={};let m,x;
  m=T.match(/JB26-?(\d{7})/i);if(m)r.no=m[1];
  m=T.match(/JB26-?\d{7}\s*:\s*([^:\n]+?)\s*:/i);if(m)r.title=m[1].trim();
  m=T.match(/\b(None|Minor|Major|Critical)\b/i);if(m)r.priority=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
  m=T.match(/Finish\s*Before\s*(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})\s+(\d{1,2}):(\d{2})/i);
  if(m){const d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]);if(!isNaN(d))r.due=d.toISOString()}
  m=T.match(/Finish\s*Before\s*[\d\-\/: ]+\s+to\s+(.+?)\s+by\s+(.*)$/im)||T.match(/\bto\s+(.+?)\s+by\s+(.*)$/im);
  if(m){r.rcv=m[1].trim();const sp=m[2],ph=sp.match(/0\d[\d-]{7,10}/);let tail=T.slice(m.index+m[0].length);
    if(ph){r.snd=sp.slice(0,ph.index).trim();r.tel=ph[0].replace(/\D/g,"");const rest=sp.slice(ph.index+ph[0].length);tail=rest+"\n"+tail;r.desc=T.slice(0,m.index+m[0].length-rest.length).trim()}
    else{r.snd=sp.trim();r.desc=T.slice(0,m.index+m[0].length).trim()}
    r.team=tail.split(/[,\u060c\u3001\n\/]|และ/).map(s=>s.trim()).filter(s=>s&&s.length<=30).slice(0,3)}
  else r.desc=T.trim();
  const pts=[],seen=new Set();
  const add=(lat,lng,n)=>{lat=+lat;lng=+lng;if(!(lat>=3&&lat<=22&&lng>=95&&lng<=107))return;const k=lat.toFixed(6)+","+lng.toFixed(6);if(seen.has(k))return;seen.add(k);pts.push({n:n||"",lat:String(+lat.toFixed(6)),lng:String(+lng.toFixed(6))})};
  const re=/(-?\d{1,2}\.\d{3,})\s*[,;\/\s]\s*(-?\d{2,3}\.\d{3,})/g;
  while((x=re.exec(T))&&pts.length<10){const pre=T.slice(Math.max(0,x.index-40),x.index).match(/([A-Za-z0-9_\-]{3,})\s*[\[\(]?\s*$/);add(x[1],x[2],pre?pre[1]:"")}
  const dm=/(\d{1,3})\s*°\s*(\d{1,2})\s*['′]\s*(\d{1,2}(?:\.\d+)?)\s*["″]?\s*([NS])[\s,]*(\d{1,3})\s*°\s*(\d{1,2})\s*['′]\s*(\d{1,2}(?:\.\d+)?)\s*["″]?\s*([EW])/gi;
  const cv=(d,mi,s,h)=>(+d+ +mi/60+ +s/3600)*(/[SW]/i.test(h)?-1:1);
  while((x=dm.exec(T))&&pts.length<10)add(cv(x[1],x[2],x[3],x[4]),cv(x[5],x[6],x[7],x[8]),"");
  const ur=/https?:\/\/(?:www\.)?(?:maps\.google\.[a-z.]+|google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)[^\s<>"')\]]*/gi;
  while((x=ur.exec(T))&&pts.length<10){if(!/-?\d{1,2}\.\d+(?:,|%2C)-?\d{2,3}\.\d+/.test(x[0]))pts.push({n:"ลิงก์แผนที่",lat:"",lng:"",url:x[0]})}
  r.pts=pts;
  const CODE={PTN:"ปัตตานี",YLA:"ยะลา",NWT:"นราธิวาส",SKA:"สงขลา"};
  const cs=[...T.matchAll(/(?:^|[^A-Za-z])(PTN|YLA|NWT|SKA)\d{2,}/gi)].map(z=>CODE[z[1].toUpperCase()]);
  if(cs.length){r.prov=cs[0];r.multi=new Set(cs).size>1}
  if(!r.prov)for(const p of Object.keys(PROV))if(T.includes(p)){r.prov=p;break}
  for(const p of r.prov?[r.prov]:Object.keys(PROV)){const d=PROV[p].find(n=>T.includes(n));if(d){r.prov=p;r.dist=d;break}}

  log("tech",t.name,(was?"แก้ไขวันลา ":"บันทึกการลา ")+from+" ถึง "+to+(note?" ("+note+")":""));persist("techs",t);$("#dlg5").close()};
$("#lv-clear").onclick=()=>{const t=findT(lvT);if(!t)return;t.leave=null;t.present=true;log("tech",t.name,"ยกเลิกการลา");persist("techs",t);$("#dlg5").close()};
/* export */
$("#exp").onclick=async()=>{if(!DL)return;const rows=jobsF().filter(match).filter(flt);
  const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const head=["เลขงาน","Priority","SLA","หัวข้อ","ผู้ส่งงาน","เบอร์ผู้ส่ง","ผู้รับงาน","เส้นตาย","รายละเอียด","จังหวัด","ช่าง 1","ช่าง 2","ช่าง 3","สถานะ",...STEPS.map(x=>x[1]),"Help เมื่อ","หมายเหตุ Help"];
  const lines=[head,...rows.map(j=>{const t=j.team||[],s=j.steps||{};return["JB26-"+j.no,pri(j),SLAT[pri(j)],j.title||"",j.sender||"",j.senderTel||"",j.receiver||"",fFull(j.deadline),j.desc,j.province,t[0]||"",t[1]||"",t[2]||"",label(status(j)),...STEPS.map(([k])=>fFull(s[k])),j.help?fFull(j.help.at):"",j.help?(j.help.note||""):""]})];
  const csv="\uFEFF"+lines.map(r=>r.map(c).join(",")).join("\r\n");
  try{await DL.save({filename:"jobs-"+today()+".csv",data:new Blob([csv],{type:"text/csv;charset=utf-8"})})}catch(e){}};

data.jobs=lsGet(KEY.jobs);data.leaves=lsGet(KEY.leaves);data.techs=lsGet(KEY.techs);data.teams=lsGet(KEY.teams);data.history=lsGet(KEY.history);render();initDb();
setInterval(()=>{if(S.tab!=="leave"&&!document.querySelector("dialog[open]"))render()},60000);
</script>
